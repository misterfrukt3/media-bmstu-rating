<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг · Media BMSTU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-grain"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logo">
        <img src="logo.png" class="logo-img" alt="Media BMSTU"
             onerror="document.getElementById('logo').classList.add('logo-fallback')" />
        <span class="logo-mark">M</span>
      </div>
      <div class="brand-text">
        <div class="brand-title">MEDIA<span class="accent">BMSTU</span></div>
        <div class="brand-sub">рейтинг семестра</div>
      </div>
    </div>

    <div class="status">
      <div class="status-item">
        <div class="status-label">обновлено</div>
        <div class="status-value" id="lastUpdated">—</div>
      </div>
      <div class="status-sep"></div>
      <div class="status-item">
        <div class="status-label">след. обновление через</div>
        <div class="status-value" id="nextUpdate">—</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="Обновить сейчас">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="refresh-btn fs-btn" id="fsBtn" title="На весь экран">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <div class="controls">
    <div class="chips" id="deptChips"></div>
    <div class="control-right">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск по фамилии…" autocomplete="off" />
      </div>
      <button class="kiosk-btn" id="kioskBtn" title="Авто-прокрутка (режим экрана)">
        <span class="kiosk-dot"></span> авто-экран
      </button>
    </div>
  </div>

  <main id="board" class="board" aria-live="polite"></main>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">загружаем рейтинг…</div>
  </div>

  <footer class="footer">
    <span id="footerInfo">Media BMSTU · данные из Google Таблицы · обновление раз в сутки</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="app.js?v=12"></script>
</body>
</html>
